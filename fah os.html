<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAH OS</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
background:url("ichi.jpg") center/cover no-repeat;
overflow:hidden;
}

.desktop{
display:flex;
flex-direction:column;
padding:20px;
gap:25px;
}

.icon{
width:90px;
text-align:center;
color:white;
cursor:pointer;
user-select:none;
}

.icon img{
width:64px;
height:64px;
border-radius:15px;
transition:.25s;
}

.icon:hover img{
transform:scale(1.1);
}

.icon p{
margin-top:8px;
font-size:15px;
text-shadow:0 0 6px black;
}

.taskbar{
position:absolute;
bottom:0;
left:0;
width:100%;
height:50px;
background:rgba(0,0,0,.55);
backdrop-filter:blur(8px);
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:18px;
}
</style>

</head>
<body>

<div class="desktop">

<div class="icon" onclick="openSite('https://www.google.com')">
<img src="https://cdn-icons-png.flaticon.com/512/300/300221.png">
<p>Google</p>
</div>

<div class="icon" onclick="openSite('https://github.com')">
<img src="https://cdn-icons-png.flaticon.com/512/25/25231.png">
<p>GitHub</p>
</div>

<div class="icon" onclick="openSite('https://www.desmos.com/scientific')">
<img src="https://cdn-icons-png.flaticon.com/512/2721/2721297.png">
<p>Calculator</p>
</div>

</div>

<div class="taskbar">
Fah OS
</div>

<script>
function openSite(url){
window.open(url,"_blank");
}
</script>

</body>
</html>
